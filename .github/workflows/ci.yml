# Every pull request and every push to main: the code must lint, typecheck, and build as both
# the website (Vercel deploys it) and the app bundle (the Android/iOS workflows ship it).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, build (web + app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build the website
        run: npm run build

      - name: Typecheck (after the build has generated route types)
        run: npm run typecheck

      - name: Build the app bundle (static export)
        run: npm run build:app -- --no-sync
        env:
          # The export only bakes this URL in; a placeholder is fine for a build check.
          NEXT_PUBLIC_API_URL: https://api.example.invalid
